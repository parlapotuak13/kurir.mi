<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eco-LogiX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== layouts/modals ===== -->
  <div id="modal-alert" class="modal" hidden>
    <div class="modal-box">
      <h3 id="modal-alert-title" class="text-lg font-semibold mb-2">Info</h3>
      <p id="modal-alert-message" class="text-sm text-gray-600 mb-4"></p>
      <div class="flex justify-end">
        <button type="button" id="modal-alert-ok" class="btn btn-primary">OK</button>
      </div>
    </div>
  </div>

  <div id="modal-confirm" class="modal" hidden>
    <div class="modal-box">
      <h3 class="text-lg font-semibold mb-2">Konfirmasi</h3>
      <p id="modal-confirm-message" class="text-sm text-gray-600 mb-4"></p>
      <div class="flex justify-end gap-2">
        <button type="button" id="modal-confirm-cancel" class="btn btn-ghost">Batal</button>
        <button type="button" id="modal-confirm-ok" class="btn btn-danger">Ya</button>
      </div>
    </div>
  </div>

  <!-- ===== auth/login_register ===== -->
  <section id="auth-section" class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6">
      <div class="text-center mb-6">
        <div class="text-3xl font-bold text-emerald-600">Eco-LogiX</div>
        <p class="text-sm text-gray-500">Logistik ramah lingkungan</p>
      </div>

      <div class="flex mb-6 bg-gray-100 rounded-lg p-1">
        <button type="button" data-auth-tab="login" class="auth-tab flex-1 py-2 rounded-md text-sm font-medium">Masuk</button>
        <button type="button" data-auth-tab="register" class="auth-tab flex-1 py-2 rounded-md text-sm font-medium">Daftar</button>
      </div>

      <form id="form-login" class="space-y-4">
        <div>
          <label class="label" for="login-email">Email</label>
          <input id="login-email" name="email" type="email" required class="input">
        </div>
        <div>
          <label class="label" for="login-password">Password</label>
          <input id="login-password" name="password" type="password" required class="input">
        </div>
        <button type="submit" class="btn btn-primary w-full">Masuk</button>
      </form>

      <form id="form-register" class="space-y-4" hidden>
        <div>
          <label class="label" for="reg-name">Nama Lengkap</label>
          <input id="reg-name" name="name" type="text" required class="input">
        </div>
        <div>
          <label class="label" for="reg-email">Email</label>
          <input id="reg-email" name="email" type="email" required class="input">
        </div>
        <div>
          <label class="label" for="reg-password">Password (min. 6 karakter)</label>
          <input id="reg-password" name="password" type="password" minlength="6" required class="input">
        </div>
        <div>
          <label class="label" for="reg-role">Peran</label>
          <select id="reg-role" name="role" class="input">
            <option value="pengirim">Pengirim</option>
            <option value="kurir">Kurir</option>
            <option value="vendor">Vendor</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-full">Daftar</button>
      </form>
    </div>
  </section>

  <!-- ===== authenticated shell ===== -->
  <div id="app-authenticated-shell" class="pb-24" hidden>
    <!-- layouts/header -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <div>
          <div class="text-xl font-bold text-emerald-600">Eco-LogiX</div>
          <div class="text-xs text-gray-500">
            Masuk sebagai <span id="header-name" class="font-semibold"></span>
            (<span id="header-role"></span>)
          </div>
        </div>
        <button type="button" id="btn-logout" class="btn btn-ghost text-sm">Keluar</button>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-5">

      <!-- pengirim/index -->
      <section id="tab-pengirim" class="tab-panel">
        <h2 class="section-title">Buat Pengiriman</h2>
        <form id="form-order" class="card space-y-3">
          <div>
            <label class="label" for="order-item">Nama Barang</label>
            <input id="order-item" name="item" required class="input">
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="label" for="order-weight">Berat (kg)</label>
              <input id="order-weight" name="weight" type="number" min="0.1" step="0.1" required class="input">
            </div>
            <div>
              <label class="label" for="order-pickup">Alamat Jemput</label>
              <input id="order-pickup" name="pickup" required class="input">
            </div>
          </div>
          <div>
            <label class="label" for="order-dropoff">Alamat Tujuan</label>
            <input id="order-dropoff" name="dropoff" required class="input">
          </div>
          <button type="submit" class="btn btn-primary w-full">Kirim Permintaan</button>
        </form>

        <h2 class="section-title mt-6">Riwayat Pengiriman Saya</h2>
        <div id="list-sender" class="space-y-3"></div>
      </section>

      <!-- kurir/index -->
      <section id="tab-kurir" class="tab-panel" hidden>
        <h2 class="section-title">Pesanan Tersedia</h2>
        <div id="list-available" class="space-y-3"></div>

        <h2 class="section-title mt-6">Tugas Saya</h2>
        <div id="list-courier" class="space-y-3"></div>
      </section>

      <!-- vendor/index -->
      <section id="tab-vendor" class="tab-panel" hidden>
        <h2 class="section-title">Tambah Produk</h2>
        <form id="form-product" class="card space-y-3">
          <div>
            <label class="label" for="prod-name">Nama Produk</label>
            <input id="prod-name" name="name" required class="input">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="label" for="prod-stock">Stok</label>
              <input id="prod-stock" name="stock" type="number" min="0" step="1" required class="input">
            </div>
            <div>
              <label class="label" for="prod-price">Harga (Rp)</label>
              <input id="prod-price" name="price" type="number" min="0" step="100" required class="input">
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-full">Simpan Produk</button>
        </form>

        <h2 class="section-title mt-6">Daftar Produk</h2>
        <div id="list-products" class="space-y-3"></div>
      </section>
    </main>

    <!-- layouts/bottom_nav -->
    <nav class="fixed bottom-0 inset-x-0 bg-white border-t shadow-inner z-30">
      <div class="max-w-5xl mx-auto grid grid-cols-3">
        <button type="button" data-tab="pengirim" class="nav-btn">
          <span class="text-lg">📦</span><span>Pengirim</span>
        </button>
        <button type="button" data-tab="kurir" class="nav-btn">
          <span class="text-lg">🛵</span><span>Kurir</span>
        </button>
        <button type="button" data-tab="vendor" class="nav-btn">
          <span class="text-lg">🏪</span><span>Vendor</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- layouts/scripts -->
  <script src="app.js"></script>
</body>
</html>
